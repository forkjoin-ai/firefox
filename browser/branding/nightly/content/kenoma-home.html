<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kenoma Operator</title>
    <link rel="stylesheet" href="chrome://branding/content/kenoma-home.css">
    <script defer src="chrome://branding/content/kenoma-home.js"></script>
  </head>
  <body>
    <div class="operator-shell" data-theme="dark">
      <div class="field" aria-hidden="true"></div>

      <header class="topbar">
        <nav class="status-rail" aria-label="Sovereign status">
          <button class="pill weather-display" id="weather-display" type="button" title="Current weather · click to change location">
            <span class="dot" aria-hidden="true"></span>
            <span id="weather-display-text">Locating…</span>
          </button>

          <a class="pill gated" href="https://storms.watch">
            <span class="dot" aria-hidden="true"></span>
            <span id="weather-pill">Storms</span>
          </a>
          <a class="pill gated" href="https://memory-api.forkjoin.ai">
            <span class="dot" aria-hidden="true"></span>
            <span id="memory-pill">Memory</span>
          </a>
          <a class="pill gated" href="https://todo.forkjoin.ai">
            <span class="dot" aria-hidden="true"></span>
            <span id="todo-pill">Todos</span>
          </a>
          <a class="pill gated" href="https://fact.forkjoin.ai">
            <span class="dot" aria-hidden="true"></span>
            <span id="fact-pill">Facts</span>
          </a>
          <button class="pill button-pill gated" id="wallet-pill" type="button" title="Custodial EDGEWORK wallet">Wallet</button>

          <button class="pill button-pill" id="identity-pill" type="button">Sign in</button>
          <button class="pill button-pill" id="focus-toggle" type="button">Focus</button>
          <time class="clock" id="clock">--:--</time>
        </nav>

        <div class="location-popover is-hidden" id="location-popover" role="dialog" aria-label="Change location">
          <input id="location-input" type="search" autocomplete="off" placeholder="Search a city or place…">
          <div class="location-results" id="location-results"></div>
        </div>

        <div class="kenoma-modal is-hidden" id="kenoma-modal" role="dialog" aria-modal="true" aria-label="Item detail">
          <div class="kenoma-modal-card">
            <div class="kenoma-modal-head">
              <strong id="kenoma-modal-title">Detail</strong>
              <button type="button" class="kenoma-modal-close" id="kenoma-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="kenoma-modal-body" id="kenoma-modal-body"></div>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="command-core" aria-labelledby="kenoma-title">
          <canvas id="wiremark" class="wiremark" width="240" height="240" aria-hidden="true"></canvas>
          <p class="eyebrow"><a href="aeon://forkjoin.ai">forkjoin.ai</a></p>
          <h1 id="kenoma-title">Kenoma</h1>

          <form class="command-form" action="https://wiki.forkjoin.ai/search" method="get">
            <label for="q" class="visually-hidden">Search the Forkjoin wiki</label>
            <div class="command-row">
              <span class="fork-stepper" role="group" aria-label="Agent fork count">
                <button type="button" id="fork-down" aria-label="Fewer forks">&minus;</button>
                <span class="fork-label" id="fork-count">FORK x1</span>
                <button type="button" id="fork-up" aria-label="More forks">+</button>
              </span>
              <input
                id="q"
                name="q"
                type="search"
                autocomplete="off"
                placeholder="Search the wiki, proofs, apps, frames..."
              >
              <div class="command-actions" id="command-actions">
                <button type="submit" class="action-run">Run</button>
                <button type="button" class="action-caret" id="action-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-label="More actions">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                </button>
                <div class="action-menu" id="action-menu" role="menu">
                  <button type="button" id="agent-run" role="menuitem" title="Run as a Moonshine browser agent">Agent</button>
                  <button type="button" id="agent-stop" role="menuitem" class="is-hidden" title="Stop the agent">Stop</button>
                </div>
              </div>
            </div>
          </form>

          <div class="chips" aria-label="Quick operations">
            <button type="button" data-query="memory protocol for browser sessions">Recall browser memory</button>
            <button type="button" data-query="weather mesh severe storms">Open weather mesh</button>
            <button type="button" data-query="aeon protocol frame transport">Trace aeon frames</button>
            <button type="button" data-query="pneuma bitwise codec">Inspect codecs</button>
          </div>
        </section>

        <section class="widget-band" id="widget-band" aria-label="Operator widgets">
          <article class="widget in-flight" data-widget="inflight" draggable="true">
            <div class="widget-head">
              <span class="drag-handle" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </span>
              <span class="widget-title">In Flight</span>
              <span class="widget-spacer"></span>
              <strong id="inflight-count">&mdash;</strong>
              <button class="collapse-button" type="button" aria-label="Collapse In Flight" aria-expanded="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
            </div>
            <div class="widget-body run-list">
              <div class="run run-empty"><span class="run-dot"></span><span><strong>Probing services…</strong><small>live sovereign status</small></span><em>…</em></div>
            </div>
          </article>

          <article class="widget" data-widget="recent" draggable="true">
            <div class="widget-head">
              <span class="drag-handle" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </span>
              <span class="widget-title">Recent</span>
              <span class="widget-spacer"></span>
              <strong>folded</strong>
              <button class="collapse-button" type="button" aria-label="Collapse Recent" aria-expanded="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
            </div>
            <ul class="widget-body recent-list" id="recent-list">
              <li class="recent-empty"><span>No recent activity</span><em>local</em></li>
            </ul>
          </article>

          <article class="widget" data-widget="launch" draggable="true">
            <div class="widget-head">
              <span class="drag-handle" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </span>
              <span class="widget-title">Launch</span>
              <span class="widget-spacer"></span>
              <strong>sovereign</strong>
              <button class="collapse-button" type="button" aria-label="Collapse Launch" aria-expanded="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
              </button>
            </div>
            <nav class="widget-body launch-grid" aria-label="Pinned Forkjoin services">
              <a href="aeon://wiki.forkjoin.ai">Wiki</a>
              <a href="https://memory-api.forkjoin.ai">Memory</a>
              <a href="https://storms.watch">Storms</a>
              <a href="https://skychat.forkjoin.ai">SkyChat</a>
              <a href="https://dashrelay.com">DashRelay</a>
              <a href="https://edgework.forkjoin.ai">Edgework</a>
            </nav>
          </article>
        </section>
      </main>

      <footer class="footer">
        <a href="https://memory-api.forkjoin.ai">memory · fractal-memory</a>
        <span id="build-id">aeon:// enabled</span>
      </footer>
    </div>
  </body>
</html>
